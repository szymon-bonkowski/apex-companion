name: Docs and agent metadata
on:
  push:
    paths:
      - '**/*.md'
      - '.agents/**'
      - 'tools/check_docs.py'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.agents/**'
      - 'tools/check_docs.py'
      - '.github/workflows/docs-check.yml'
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate documentation and skills
        run: python3 tools/check_docs.py
